services:
  backend:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - SMS_PROVIDER=${SMS_PROVIDER:-africas_talking}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-africas_talking}
      - AT_USERNAME=${AT_USERNAME}
      - AT_API_KEY=${AT_API_KEY}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - SEED_ON_STARTUP=true
    volumes:
      - safepass-data:/app/safepass.db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  safepass-data:
